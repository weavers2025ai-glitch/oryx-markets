const POSTS = [
 {id:1, cat:'GOLD', img:'images/news-gold.webp', title:'Why Gold Moves: The Forces Behind XAU/USD', ex:'Gold reacts to interest rates, the US dollar and global uncertainty. Here is how to read those signals before you trade XAU/USD.', body:['Gold is traded around the clock, but its biggest moves usually come from three forces: US interest-rate expectations, the strength of the US dollar, and demand for safety during uncertain times. When rate-cut expectations rise, gold often climbs; when the dollar strengthens sharply, gold usually feels pressure.','For traders, the practical lesson is to watch the calendar. US inflation data, Federal Reserve decisions and employment reports regularly move gold by several dollars within minutes. Trading into those releases without a plan turns a strategy into a gamble.','A calmer approach: note the day\'s high and low, wait for price to show direction after the news, and size positions so a sudden spike cannot damage the account. Gold rewards patience more than speed.']},
 {id:2, cat:'RISK MANAGEMENT', img:'images/news-risk.webp', title:'5 Risk Rules Every Trader Should Follow', ex:'Most accounts are lost through oversized positions, not bad analysis. These five rules keep small losses small.', body:['Rule one: risk a fixed small percentage per trade — many experienced traders stay near 1–2% of the account. Rule two: always know your exit before you enter; a stop loss decided in advance is calmer than one invented mid-trade.','Rule three: never add to a losing position just to "average in" without a written plan. Rule four: stop trading for the day after a set loss limit; tired and frustrated decisions are expensive. Rule five: keep a simple journal — pair, reason, result — and review it weekly.','None of these rules require special talent. They simply make sure that a normal run of losses cannot end your trading. Survival first, growth second.']},
 {id:3, cat:'EDUCATION', img:'images/news-education.webp', title:'Reading a Candlestick Chart in 10 Minutes', ex:'Candles tell the story of buyers and sellers in every period. Learn the body, the wicks and the patterns that matter.', body:['Each candle shows four prices: open, high, low and close. A long body means one side dominated the period; long wicks mean price travelled far but was rejected. A candle closing near its high after a fall often signals buyers stepping in.','Patterns such as Hammer, Doji and Engulfing describe shifts in momentum, but they work best at meaningful levels — near yesterday\'s high or low, or after a clear trend. A pattern in the middle of nowhere means little.','Start simple: mark the day\'s high and low, watch how candles behave there, and only then add indicators. Ten minutes of this routine daily builds chart-reading skill faster than any shortcut.']},
 {id:4, cat:'FOREX BASICS', img:'images/banner-markets.webp', title:'EUR/USD Explained: Trading the World\'s Biggest Pair', ex:'EUR/USD is the most traded pair on earth. Understand what drives it and when it moves best.', body:['EUR/USD reflects the balance between the eurozone and US economies. Interest-rate decisions from the European Central Bank and the Federal Reserve, plus inflation and jobs data on both sides, set its direction for weeks at a time.','The pair is most active when London and New York sessions overlap, roughly 13:00–17:00 GMT, when spreads are tightest and moves are cleanest. Asian-session trading in EUR/USD is often slow and range-bound.','Beginners do well to master this one pair first: learn its average daily range, its reaction to US data, and its typical turning points before spreading attention across ten pairs.']},
 {id:5, cat:'STRATEGY', img:'images/how-oryx.webp', title:'Trend Trading: Riding Moves Instead of Fighting Them', ex:'Trading with the trend keeps you on the side of the larger flow. Here is a simple framework to identify and follow trends.', body:['A trend is simply a sequence of higher highs and higher lows (uptrend) or lower highs and lower lows (downtrend). Moving averages make this visible: price above a rising average suggests buyers control the market.','The framework is straightforward: identify the trend on a higher timeframe, wait for a pullback toward the average or a previous level, then enter in the trend\'s direction with a stop beyond the pullback. Targets can trail as the trend extends.','Most trend trades fail not because the idea is wrong, but because traders enter late after extended moves. Patience for the pullback is the strategy.']},
 {id:6, cat:'INDICATORS', img:'images/broker-desk.webp', title:'RSI, MACD and Stochastic: Using Oscillators Without Noise', ex:'Oscillators measure momentum, not magic. Learn what each one actually tells you and how to combine them sensibly.', body:['RSI compares recent gains to losses and flags stretched conditions above 70 or below 30. MACD tracks the relationship between two moving averages and highlights momentum shifts. Stochastic shows where price sits within its recent range.','The common mistake is stacking all three and waiting for perfect agreement — by then the move is over. A cleaner method: use one oscillator for timing entries within a trend identified by price structure or moving averages.','In strong trends, RSI can stay overbought for days. Treat oscillator extremes as warnings to tighten risk, not automatic reversal signals.']},
 {id:7, cat:'MONEY MANAGEMENT', img:'images/banner-welcome.webp', title:'Position Sizing: The Math That Protects Your Account', ex:'Lot size decides how much a normal market move helps or hurts you. Size positions from your stop distance, not your confidence.', body:['Position sizing starts with two numbers: how much of the account you are willing to risk on one idea, and how far your stop loss sits from entry. Divide the risk amount by the stop distance in money terms and the lot size follows automatically.','Example: on a $1,000 account risking 1% ($10) with a stop 50 points away on gold, the position must be small enough that 50 points equals $10. Confidence does not enter the formula — that is the point.','Traders who size this way can survive ten losses in a row and still be in the game. Traders who size by feeling usually cannot.']},
 {id:8, cat:'MARKETS', img:'images/banner-app.webp', title:'Trading Sessions: When Each Market Wakes Up', ex:'Tokyo, London and New York each bring different behaviour. Match your trading hours to the pairs you trade.', body:['The trading day rolls through three main sessions. Tokyo is calmer and favours yen pairs and gold ranges. London brings the first real volume and often sets the day\'s direction. New York adds US data and the day\'s largest moves.','The London–New York overlap is the most liquid window: spreads narrow and breakouts carry further. Trading EUR/USD at 3 a.m. GMT, by contrast, usually means paying spread for very little movement.','Build your routine around one or two sessions you can attend consistently. Consistency of hours builds pattern recognition that random trading never will.']},
 {id:9, cat:'PSYCHOLOGY', img:'images/banner-team-real.webp', title:'The Psychology of Losses: Staying Calm After a Red Day', ex:'Losses are a cost of doing business. How you respond to them decides whether they stay small.', body:['Every professional trader loses regularly; what separates them is behaviour after the loss. Revenge trading — doubling size to win it back — converts a normal loss into an account-threatening one.','A practical reset: after two consecutive losses, step away for at least an hour. Review whether the trades followed your plan. If they did, the losses are statistics; if they did not, the fix is discipline, not a new indicator.','Judge yourself weekly on plan adherence, not daily profit. Calm, repeatable execution compounds; emotional trading does not.']},
 {id:10, cat:'TOOLS', img:'images/banner-journey-team.webp', title:'Pending Orders, Stop Loss and Take Profit: Your Trading Toolkit', ex:'Market orders are only the beginning. Pending orders and protective exits let you plan trades in advance and manage them calmly.', body:['A pending order waits for your price: buy limit below the market, sell limit above it, or stop orders that trigger when momentum confirms. Planning entries in advance removes the pressure of watching every tick.','Stop loss caps the damage when an idea fails; take profit banks gains at a planned level. Setting both at entry turns each trade into a defined risk with a defined reward — the foundation of consistent results.','Review your closed trades monthly: are stops too tight, targets too greedy? Small adjustments to these two settings often improve results more than any new entry signal.']}
];
const EXPAND = {
1:{more:['Central-bank buying is the fourth force traders often forget. When central banks add gold to reserves, they create steady long-term demand that supports price even when short-term traders sell. Jewellery demand in Asia and investment demand through funds add another layer, which is why gold can rise during festivals and wedding seasons as well as during crises.','Technically, gold respects round numbers and previous highs. A break above a level that rejected price twice before usually attracts momentum buyers, while a failed break often reverses quickly. Watching how price behaves at those levels tells you more than any single indicator.','For position management, gold moves fast enough that wide stops with small size work better than tight stops with large size. A $5 move in gold is routine; your lot size should survive several such moves without threatening the account.','A practical routine: check the US dollar index and the economic calendar before the session, mark yesterday\u2019s high and low, and only trade when price gives a clear reaction at a level. Gold rewards preparation and punishes guessing.'],chart:'<div class="bl-chart"><h4>Gold price — illustrative weekly move</h4><svg viewBox="0 0 640 220" width="100%"><polyline points="20,170 110,150 200,160 290,110 380,120 470,70 560,85 620,45" fill="none" stroke="#E8890C" stroke-width="4"/><circle cx="470" cy="70" r="6" fill="#0A1128"/><text x="430" y="55" font-size="14" fill="#334155">news spike</text><text x="20" y="205" font-size="13" fill="#64748B">Mon</text><text x="300" y="205" font-size="13" fill="#64748B">Wed</text><text x="590" y="205" font-size="13" fill="#64748B">Fri</text></svg></div>',points:['Watch US rates, the dollar and safe-haven demand','Mark yesterday\u2019s high and low before trading','Use small size with room for gold\u2019s fast moves','Avoid guessing into major US data releases']},
2:{more:['The mathematics behind these rules is simple but unforgiving. Losing 10% of an account needs an 11% gain to recover; losing 50% needs a 100% gain. Risk rules exist to keep you on the easy side of that curve, where recovery stays realistic.','Risk also includes how many trades you open at once. Five positions on correlated pairs are really one big position. Limit total open risk across the account, not just per trade, so one market event cannot damage everything at the same time.','A weekly review turns rules into habits. Check whether stops were respected, whether size stayed consistent, and whether losses came from the plan or from emotion. Most traders discover their plan works better than their impulses.','Finally, protect the account from yourself on bad days: a daily loss limit, a maximum number of trades, and a hard stop after two emotional decisions. Discipline is a system, not a mood.'],chart:'<div class="bl-chart"><h4>Gain needed to recover a loss</h4><svg viewBox="0 0 640 220" width="100%"><rect x="60" y="150" width="70" height="40" fill="#16A34A"/><rect x="190" y="130" width="70" height="60" fill="#E8890C"/><rect x="320" y="90" width="70" height="100" fill="#DC2626"/><rect x="450" y="30" width="70" height="160" fill="#7F1D1D"/><text x="55" y="205" font-size="13" fill="#334155">-10%</text><text x="185" y="205" font-size="13" fill="#334155">-20%</text><text x="315" y="205" font-size="13" fill="#334155">-33%</text><text x="445" y="205" font-size="13" fill="#334155">-50%</text><text x="60" y="140" font-size="13" fill="#334155">+11%</text><text x="450" y="20" font-size="13" fill="#334155">+100%</text></svg></div>',points:['Risk 1–2% per trade, with a fixed daily limit','Know your exit before you enter','Limit total open risk, not just single trades','Review weekly: plan errors vs emotion errors']},
3:{more:['Timeframe changes the story. A Hammer on a one-minute chart is noise; the same shape on a daily chart at a major support level carries real weight. Always read candles on the timeframe that matches your holding period, and check the higher timeframe for overall direction.','Candle colour alone is not a signal. A green candle after a long fall may simply be profit-taking by sellers. What matters is where the candle closes relative to the previous range and whether follow-through appears in the next candles.','Combine candles with simple structure: swing highs and lows, trend lines and moving averages. A Bullish Engulfing candle at a rising moving average after a pullback is a complete idea; the same candle in mid-range is just a picture.','Practice by marking yesterday\u2019s candles before the session: where did buyers defend, where did sellers push, and where did price close? Repeating this ten-minute review builds genuine chart sense within weeks.'],chart:'<div class="bl-chart"><h4>Candles: body, wicks and direction</h4><svg viewBox="0 0 640 220" width="100%"><line x1="120" y1="30" x2="120" y2="180" stroke="#16A34A" stroke-width="4"/><rect x="95" y="70" width="50" height="80" fill="#16A34A"/><line x1="280" y1="40" x2="280" y2="190" stroke="#DC2626" stroke-width="4"/><rect x="255" y="80" width="50" height="70" fill="#DC2626"/><line x1="440" y1="50" x2="440" y2="170" stroke="#E8890C" stroke-width="4"/><rect x="415" y="105" width="50" height="12" fill="#E8890C"/><text x="80" y="205" font-size="13" fill="#334155">Bullish</text><text x="245" y="205" font-size="13" fill="#334155">Bearish</text><text x="420" y="205" font-size="13" fill="#334155">Doji</text></svg></div>',points:['Body = open to close; wicks = rejection','Patterns matter most at key levels','Match candle timeframe to your trade length','Confirm with follow-through candles']},
4:{more:['Interest-rate difference is the engine. When US rates rise faster than eurozone rates, capital tends to favour the dollar and EUR/USD falls; when the European Central Bank sounds more aggressive, the pair can rally even on quiet days. Speeches by central bankers therefore move this pair as much as data does.','Technically EUR/USD respects weekly ranges and previous highs and lows. Many traders map the Asian session range and watch how London breaks or rejects it. A clean break with follow-through often continues into New York; a break that snaps back warns of a trap.','Risk on EUR/USD is usually lower per pip than gold, which makes it friendly for learning position sizing. Its moves are slower, stops can be tighter in money terms, and slippage is rare outside major news.','A sensible beginner plan: trade EUR/USD only during the London–New York overlap, use one setup, and record every result for a month before adding a second pair. Depth in one market beats shallow knowledge of many.'],chart:'<div class="bl-chart"><h4>EUR/USD activity by session (illustrative)</h4><svg viewBox="0 0 640 220" width="100%"><rect x="60" y="140" width="90" height="50" fill="#94A3B8"/><rect x="210" y="70" width="90" height="120" fill="#E8890C"/><rect x="360" y="40" width="90" height="150" fill="#0A1128"/><rect x="510" y="110" width="90" height="80" fill="#64748B"/><text x="70" y="205" font-size="13" fill="#334155">Tokyo</text><text x="215" y="205" font-size="13" fill="#334155">London</text><text x="365" y="205" font-size="13" fill="#334155">Overlap</text><text x="505" y="205" font-size="13" fill="#334155">New York</text></svg></div>',points:['Rates and central-bank tone drive the pair','Best activity: London–New York overlap','Map the Asian range before London','Master one pair before adding more']},
5:{more:['Trend strength matters as much as direction. Steep trends with shallow pullbacks signal strong momentum but punish late entries; slow, grinding trends offer repeated pullback entries. Adjust expectations: in strong trends, take partial profits and let the rest run; in weak trends, take profits sooner.','Moving averages help define the trend objectively. Price above a rising 50-period average with the average itself sloping up is a working definition of an uptrend. When price crosses back and forth through a flat average, the market is ranging and trend methods should pause.','Entries improve when pullbacks end with evidence: a bullish candle at support, a higher low, or a break of the pullback\u2019s minor trend line. Entering on hope during the fall is how trend traders become counter-trend victims.','Exit rules complete the system. Trail stops behind swing lows, or exit when price closes through the average. Trends end gradually more often than suddenly, so a trailing exit captures most of the move without predicting the top.'],chart:'<div class="bl-chart"><h4>Uptrend: higher highs, pullback entries</h4><svg viewBox="0 0 640 220" width="100%"><polyline points="20,180 120,140 190,160 300,100 370,120 480,60 550,80 620,35" fill="none" stroke="#16A34A" stroke-width="4"/><circle cx="190" cy="160" r="6" fill="#E8890C"/><circle cx="370" cy="120" r="6" fill="#E8890C"/><circle cx="550" cy="80" r="6" fill="#E8890C"/><text x="150" y="195" font-size="13" fill="#334155">pullback entry</text><text x="470" y="45" font-size="13" fill="#334155">higher high</text></svg></div>',points:['Define trend with structure + moving average','Enter on pullbacks, not after extended moves','Wait for evidence the pullback ended','Trail exits instead of predicting tops']},
6:{more:['RSI divergence is one of the more useful oscillator signals: price makes a new high while RSI makes a lower high, warning that momentum is fading. Divergence alone rarely reverses a strong trend, but it is a good reason to tighten stops and reduce size.','MACD works best as a trend-momentum filter. When MACD is above zero, favour long setups; below zero, favour shorts. Crossovers near the zero line tend to be more meaningful than crosses deep in overbought or oversold territory.','Stochastic is fastest of the three and therefore noisiest. Use it for timing inside a trend: in an uptrend, stochastic dipping toward 20 and turning up can mark a pullback entry, while the same reading in a downtrend means little.','Whichever oscillator you choose, test it on your market and timeframe before trusting it. Indicators behave differently on gold than on EUR/USD, and a setting that works on daily charts may mislead on one-minute charts.'],chart:'<div class="bl-chart"><h4>RSI with 70 / 30 bands</h4><svg viewBox="0 0 640 220" width="100%"><line x1="20" y1="60" x2="620" y2="60" stroke="#DC2626" stroke-dasharray="6 5"/><line x1="20" y1="160" x2="620" y2="160" stroke="#16A34A" stroke-dasharray="6 5"/><polyline points="20,130 120,90 220,45 320,80 420,140 520,100 620,70" fill="none" stroke="#E8890C" stroke-width="4"/><text x="560" y="50" font-size="13" fill="#DC2626">70</text><text x="560" y="180" font-size="13" fill="#16A34A">30</text></svg></div>',points:['One oscillator for timing, trend for direction','Divergence = warning, not automatic reversal','MACD above zero favours longs','Test settings on your own market']}
,
7:{more:['A worked example makes the method concrete. Account $2,000, risk 1% = $20. Gold stop distance $4 (400 points): position size must lose $20 when price moves $4, so size = 20 / 4 = 5 units of $1-per-point exposure — in lot terms, roughly 0.05 lots on typical gold contracts. The stop distance chose the size; opinion played no part.','Wider stops are not riskier when size shrinks to match. Many traders fear wide stops, but a wide stop with small size risks the same money as a tight stop with large size — and survives normal noise better. Size and stop distance are two sides of one decision.','Leverage changes margin, not risk. High leverage lets a small account open large positions, but the loss at your stop is decided by size and distance alone. Treat leverage as a tool for flexibility, never as permission to oversize.','Recalculate size as the account changes. After growth, the same percentage risk allows slightly larger positions; after losses, size must shrink to protect what remains. Fixed lot sizes on a changing account quietly break the whole system.'],chart:'<div class="bl-chart"><h4>Stop distance vs lot size (same $20 risk)</h4><svg viewBox="0 0 640 220" width="100%"><rect x="60" y="50" width="80" height="140" fill="#DC2626"/><rect x="210" y="100" width="80" height="90" fill="#E8890C"/><rect x="360" y="140" width="80" height="50" fill="#16A34A"/><rect x="510" y="165" width="80" height="25" fill="#0A1128"/><text x="55" y="205" font-size="13" fill="#334155">$1 stop</text><text x="205" y="205" font-size="13" fill="#334155">$2 stop</text><text x="355" y="205" font-size="13" fill="#334155">$4 stop</text><text x="505" y="205" font-size="13" fill="#334155">$8 stop</text></svg></div>',points:['Size = risk amount ÷ stop distance','Wide stop + small size = same money risk','Leverage changes margin, not risk','Recalculate size as balance changes']},
8:{more:['Gold follows its own rhythm inside these sessions. Asian hours often build a range; London frequently breaks it; New York data can reverse the whole day in minutes. Knowing which session you are in prevents expecting London behaviour from a quiet Tokyo morning.','Daylight-saving changes shift session times twice a year. Traders who hard-code hours get caught out every spring and autumn. Check your platform clock against GMT whenever clocks change in the US or Europe.','News releases cluster at session starts: European data in the London morning, US data at 13:30 GMT. Volatility around those minutes is real but direction is not guaranteed — many professionals wait for the first reaction to settle before entering.','If your schedule only allows one hour a day, choose the same hour daily and learn its character deeply. A familiar hour traded consistently beats random hours traded occasionally.'],chart:'<div class="bl-chart"><h4>Trading day: sessions across 24 hours (GMT)</h4><svg viewBox="0 0 640 220" width="100%"><rect x="20" y="60" width="180" height="40" fill="#94A3B8"/><rect x="180" y="60" width="220" height="40" fill="#E8890C"/><rect x="360" y="60" width="200" height="40" fill="#0A1128"/><text x="55" y="85" font-size="14" fill="#fff">Tokyo</text><text x="240" y="85" font-size="14" fill="#fff">London</text><text x="400" y="85" font-size="14" fill="#fff">New York</text><rect x="360" y="120" width="40" height="40" fill="#16A34A"/><text x="330" y="180" font-size="13" fill="#334155">Overlap = most liquid</text></svg></div>',points:['London sets direction, New York adds data moves','Overlap hours give tightest spreads','Watch daylight-saving clock shifts','Trade the same hours consistently']},
9:{more:['Loss aversion is measurable: losses feel roughly twice as strong as equal gains. That is why traders hold losing trades hoping for recovery while cutting winners early — the exact opposite of profitable behaviour. Naming the bias is the first defence against it.','A written plan converts emotion into procedure. Entry, stop, target and maximum daily loss decided before the session leave little to negotiate mid-trade. When the urge to improvise appears, the plan answers instead of the feeling.','Journaling closes the loop. Record not only prices but state of mind: tired, rushed, confident, angry. Within a month most traders find their worst losses share the same emotional conditions — and can simply avoid trading in them.','Recovery is a skill. After a red day, reduce size for the next session rather than increasing it. Smaller size rebuilds confidence with real evidence, while doubled size after losses usually digs the hole deeper.'],chart:'<div class="bl-chart"><h4>Recovery math: loss vs gain needed</h4><svg viewBox="0 0 640 220" width="100%"><polyline points="20,40 160,80 300,120 440,160 620,200" fill="none" stroke="#DC2626" stroke-width="4"/><polyline points="20,200 160,165 300,120 440,70 620,25" fill="none" stroke="#16A34A" stroke-width="4"/><text x="430" y="185" font-size="13" fill="#DC2626">account falling</text><text x="430" y="55" font-size="13" fill="#16A34A">gain needed grows</text></svg></div>',points:['Losses feel twice as strong as gains','A written plan replaces mid-trade emotion','Journal state of mind, not just prices','After losses, reduce size — never double']},
10:{more:['Limit and stop orders serve opposite ideas. A buy limit waits below price for a cheaper entry at support; a buy stop waits above price to join a breakout. Mixing them up is common for beginners, so check the order type on the confirmation screen every time.','Stop-loss placement should come from chart structure, not from a fixed number of points. Place it beyond the level that proves your idea wrong — below the swing low for a long, above the swing high for a short — then size the position to that distance.','Take-profit placement works best at the next meaningful level: previous highs, round numbers, or measured moves. A target placed in empty space with no reason is usually either too greedy or too timid.','Pending orders also protect you from yourself. Setting the full trade — entry, stop, target — in advance means the market must come to your plan. Traders who chase price with market orders pay spread and emotion on every entry.'],chart:'<div class="bl-chart"><h4>Planned trade: entry, stop loss, take profit</h4><svg viewBox="0 0 640 220" width="100%"><line x1="20" y1="50" x2="620" y2="50" stroke="#16A34A" stroke-dasharray="7 5"/><line x1="20" y1="110" x2="620" y2="110" stroke="#0A1128" stroke-width="3"/><line x1="20" y1="170" x2="620" y2="170" stroke="#DC2626" stroke-dasharray="7 5"/><text x="470" y="42" font-size="14" fill="#16A34A">Take Profit</text><text x="490" y="102" font-size="14" fill="#0A1128">Entry</text><text x="480" y="195" font-size="14" fill="#DC2626">Stop Loss</text></svg></div>',points:['Limit = cheaper entry; Stop = breakout entry','Stops belong beyond structure, not fixed points','Targets belong at meaningful levels','Plan the full trade before entering']},
11:{more:[],chart:'<div class="bl-chart"><h4>Bull vs Bear: who controls the market?</h4><svg viewBox="0 0 640 220" width="100%"><polyline points="20,170 160,120 300,135 440,70 620,40" fill="none" stroke="#16A34A" stroke-width="4"/><polyline points="20,50 160,95 300,80 440,140 620,180" fill="none" stroke="#DC2626" stroke-width="4"/><text x="480" y="35" font-size="15" fill="#16A34A">BULLS rising</text><text x="480" y="205" font-size="15" fill="#DC2626">BEARS falling</text></svg></div>',points:['Bulls push price up; bears push it down','Higher highs = bulls in control','Trade with the controlling side','Sentiment flips at key levels first']},
12:{more:[],chart:'<div class="bl-chart"><h4>New trader path: step by step</h4><svg viewBox="0 0 640 220" width="100%"><rect x="40" y="160" width="100" height="35" fill="#94A3B8"/><rect x="170" y="125" width="100" height="70" fill="#E8890C"/><rect x="300" y="90" width="100" height="105" fill="#0A1128"/><rect x="430" y="55" width="100" height="140" fill="#16A34A"/><text x="45" y="210" font-size="12" fill="#334155">Learn</text><text x="175" y="210" font-size="12" fill="#334155">Practice</text><text x="305" y="210" font-size="12" fill="#334155">Small size</text><text x="435" y="210" font-size="12" fill="#334155">Review</text></svg></div>',points:['Learn one market and one setup first','Practice before risking real money','Start with the smallest size','Keep a journal from day one']}

const NEWPOSTS = [
{id:11, cat:'MARKET SENTIMENT', img:'images/blog/thumb-11.webp', title:'Bull vs Bear: Understanding Market Sentiment', ex:'Every chart is a fight between buyers (bulls) and sellers (bears). Learn how to see who is winning and trade with the stronger side.', body:['In every market, two groups push price in opposite directions. Bulls are buyers who expect price to rise; they are named after the bull that thrusts its horns upward. Bears are sellers who expect price to fall, named after the bear that swipes its paws downward. Every candle you see is the result of their contest.','When bulls control the market, price makes higher highs and higher lows, pullbacks are shallow, and bad news barely dents the rise. This is a bullish market. When bears control it, rallies fail quickly, lows keep breaking, and good news cannot lift price for long — a bearish market.','Sentiment shows itself in candle behaviour. Long green bodies closing near their highs show aggressive buying; long upper wicks show sellers rejecting higher prices. A sequence of such clues tells you which side is pressing harder right now.','The practical rule for traders: trade with the controlling side. In a bullish market, buy pullbacks instead of shorting strength. In a bearish market, sell rallies instead of catching falling prices. Fighting the dominant side is the most common beginner mistake.','Control changes at important levels. A bullish market that fails twice at the same resistance and then breaks its last higher low may be handing control to bears. Watch those turning points; they are where sentiment — and opportunity — shifts.','Finally, sentiment is not a prediction machine. It describes current pressure, which can change with news in minutes. Use it to align your trades with the stronger flow, keep stops honest, and let the market prove you wrong cheaply when it turns.']},
{id:12, cat:'BEGINNER GUIDE', img:'images/blog/thumb-12.webp', title:'New Trader Guide: What Beginners Should Do First', ex:'Starting trading? Follow this order: learn one market, practice safely, start tiny, and review every trade. Here is the complete beginner path.', body:['Every new trader asks the same question: where do I start? The honest answer is boring but powerful — start with learning, not with money. Pick one market, such as gold or EUR/USD, and study how it moves: its active hours, its typical daily range, and how it reacts to news.','Second, learn the basic tools before any strategy: how to read candles, what a stop loss and take profit do, and how lot size decides your risk. Most beginner losses come not from wrong direction but from oversized positions with no exit plan.','Third, practice with the smallest possible size. Your first goal is not profit; it is survival and data. Trade one simple setup — for example, buying pullbacks in an uptrend — and record every trade: reason, entry, stop, result. Twenty recorded trades teach more than two hundred random ones.','Fourth, set rules before the session: maximum risk per trade (1–2%), maximum daily loss, and a fixed number of trades. When the limit is hit, close the platform. Discipline in the first months decides whether you are still trading in month six.','Fifth, review weekly. Look for patterns: which setups worked, which hours hurt you, which losses came from emotion. Adjust one thing at a time. Trading skill grows through this loop of plan, execute, review — not through hunting for a perfect indicator.','Finally, be patient with growth. Increase size only after a month of consistent, rule-based trading. The traders who last are not the fastest starters; they are the ones who protected their account long enough for skill to compound.']}
];
